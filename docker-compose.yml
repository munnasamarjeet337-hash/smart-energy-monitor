version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: energy_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  mongodb:
    image: mongo:7.0
    container_name: energy_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energy_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URL=mongodb://mongodb:27017/energy
      - MQTT_URL=mqtt://mosquitto:1883
      - JWT_SECRET=smart_energy_secret_key_2026_jwt_token
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mosquitto
      - mongodb

volumes:
  mongo_data:
    name: energy_mongo_data
